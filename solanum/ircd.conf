/*
 * Solanum test server config.
 * Minimal on purpose: anything not set here is the compiled-in default
 * (see doc/reference.conf in the solanum source).
 *
 * Connect-back checks are all off. Test clients usually connect from the
 * Docker host, so the ircd sees the Docker bridge gateway as the client
 * address; a host firewall that silently drops connect-backs, or a
 * resolver that never answers PTR queries for the bridge range, would make
 * every such check wait out its full timeout before the client can
 * register. disable_auth (below) turns off ident; there are deliberately
 * no dnsbl {} or opm {} blocks; reverse DNS has no config switch, so the
 * Dockerfile patches authd not to do it at all.
 */

serverinfo {
	name = "solanum.example.irc.com";
	sid = "0SO";
	description = "Solanum test server";
	network_name = "ExampleNet";

	/*
	 * The repo's shared test certificate (certs/). ssl_cert is loaded
	 * with SSL_CTX_use_certificate_chain_file, so the leaf+CA chain is
	 * sent. No ssl_dh_params: ssld logs that none were given and simply
	 * offers no DHE- ciphers; ECDHE and TLS 1.3 are unaffected.
	 */
	ssl_cert = "/opt/solanum/etc/server-chain.crt";
	ssl_private_key = "/opt/solanum/etc/server.key";
};

admin {
	name = "ExampleNet";
	description = "Test server administrator";
	email = "<nobody@example.irc.com>";
};

/*
 * Tests open several simultaneous connections, all from the same address
 * (the Docker bridge gateway), so lift the per-ip/ident/cidr caps.
 */
class "users" {
	ping_time = 2 minutes;
	number_per_ident = 1000;
	number_per_ip = 1000;
	number_per_ip_global = 1000;
	number_per_cidr = 1000;
	max_number = 1000;
	sendq = 1 megabyte;
};

listen {
	port = 4447;
	sslport = 5557;
};

auth {
	user = "*@*";
	class = "users";
	/* Ignore class limits; no flood or spambot throttling of test clients. */
	flags = exceed_limit, flood_exempt, spambot_exempt;
};

/* One privset with every core privilege (privsets aren't built in). */
privset "admin" {
	privs = oper:general, oper:privs, oper:testline, oper:kill,
		oper:operwall, oper:message, usermode:servnotice,
		auspex:oper, auspex:hostname, auspex:umodes, auspex:cmodes,
		oper:routing, oper:kline, oper:unkline, oper:xline, oper:resv,
		oper:cmodes, oper:mass_notice, oper:wallops, oper:remoteban,
		oper:admin, oper:die, oper:rehash, oper:spy, oper:grant,
		snomask:nick_changes;
};

/*
 * Two test opers, password "password" for both, from anywhere.
 * ~encrypted: the password is compared as plain text, not a crypt hash
 * (encrypted is the default).
 */
operator "alice" {
	user = "*@*";
	password = "password";
	flags = ~encrypted;
	privset = "admin";
};

operator "daniel" {
	user = "*@*";
	password = "password";
	flags = ~encrypted;
	privset = "admin";
};

channel {
	/*
	 * A lone unlinked server is otherwise permanently "split" (default
	 * thresholds are 10 servers / 15000 users), and split mode refuses
	 * to create channels -- so the first JOIN would fail instead of
	 * getting ops.
	 */
	default_split_server_count = 0;
	default_split_user_count = 0;
	no_create_on_split = no;
	no_join_on_split = no;
};

general {
	/* No ident (connect-back) lookup -- see header. */
	disable_auth = yes;
	/*
	 * Tests reconnect from one address many times a minute; the default
	 * (4 connections per 60s per IP) would reject them.
	 */
	throttle_count = 1000;
	throttle_duration = 1;
	/* Don't cache and auto-reject IPs of previously rejected clients. */
	reject_after_count = 0;
	/* Don't rate-limit LIST/LUSERS/ADMIN/INFO etc. between uses. */
	pace_wait = 0 seconds;
	pace_wait_simple = 0 seconds;
};
