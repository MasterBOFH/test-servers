# ngIRCd test server config. Minimal on purpose: everything not set
# here is ngIRCd's default; see doc/sample-ngircd.conf and
# ngircd.conf(5) upstream, or run "ngircd --configtest" in the image.

[Global]
	Name = ngircd.example.irc.com
	Info = ExampleNet ngircd test server
	AdminInfo1 = ExampleNet test servers
	AdminInfo2 = ngircd test server
	AdminEMail = nobody@example.irc.com
	Network = ExampleNet
	MotdFile = /opt/ngircd/etc/ngircd.motd
	# Plain-TCP client port (TLS port is in [SSL] below).
	Ports = 4445
	# The user the image already runs as. Left at the default (root),
	# ngIRCd tries to switch to "nobody" and logs errors when it can't.
	ServerUID = ircd
	ServerGID = ircd

[Limits]
	# Default 5 per IP; test clients all share the Docker bridge
	# gateway's IP. 0 = unlimited.
	MaxConnectionsIP = 0

[Options]
	# No connect-back checks: clients connect from the Docker host, so
	# the ircd sees the Docker bridge gateway as the client, and a host
	# firewall may silently DROP connect-backs to it (and its resolver
	# may never answer PTR queries for the bridge range). Every such
	# check would stall registration for its full timeout. Ident and
	# PAM are not compiled in (both are opt-in at configure time), and
	# ngIRCd has no proxy/DNSBL scanner; reverse DNS is switched off here.
	DNS = no
	# Let opers change channel modes without being chanop.
	OperCanUseMode = yes

[SSL]
	# TLS on 5555. CertFile is loaded as a chain (leaf + CA), so clients
	# can verify against certs/ca.crt alone.
	CertFile = /opt/ngircd/etc/ssl/server-chain.crt
	KeyFile = /opt/ngircd/etc/ssl/server.key
	Ports = 5555

# OPER alice password / OPER daniel password. No Mask: accepted from
# any nick!user@host.
[Operator]
	Name = alice
	Password = password

[Operator]
	Name = daniel
	Password = password
