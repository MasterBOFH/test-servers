/*
 * ircd-hybrid 8.2.x test server config.
 * Minimal on purpose: anything not set here is the compiled-in default
 * (see doc/reference.ircd.conf in the ircd-hybrid source).
 *
 * Connect-back checks are all off (ident, reverse DNS, connect throttle).
 * Test clients usually connect from the Docker host, so the ircd sees the
 * Docker bridge gateway as the client address; a host firewall that
 * silently drops connect-backs, or a resolver that never answers PTR
 * queries for the bridge range, would make every such check wait out its
 * full timeout before the client can register.
 */

/* Standard module set, installed alongside this file by `make install`. */
.include "reference.modules.conf";

serverinfo {
	name = "hybrid.example.irc.com";
	sid = "0HY";
	description = "ircd-hybrid test server";
	network_name = "ExampleNet";
	network_description = "ExampleNet test network";
	hub = no;
	/* No compiled-in default: without this there is no MOTD at all. */
	motd_file = "/opt/hybrid/etc/ircd.motd";

	/*
	 * The repo's shared test certificate (certs/). The certificate file
	 * is loaded with SSL_CTX_use_certificate_chain_file, so the leaf+CA
	 * chain is sent. No DH params: OpenSSL picks ECDHE on its own.
	 */
	rsa_private_key_file = "/opt/hybrid/etc/server.key";
	tls_certificate_file = "/opt/hybrid/etc/server-chain.crt";
};

admin {
	name = "ExampleNet";
	description = "Test server administrator";
	email = "<nobody@example.irc.com>";
};

class {
	name = "users";
	ping_time = 90 seconds;
	/* Tests open several connections at once from the same (gateway) IP. */
	number_per_ip_local = 1000;
	number_per_ip_global = 1000;
	number_per_cidr = 1000;
	cidr_bitlen_ipv4 = 32;
	cidr_bitlen_ipv6 = 128;
	max_number = 1000;
	sendq = 1 megabyte;
	recvq = 8 kilobytes;
};

listen {
	port = 4442;
};

listen {
	/* "flags" applies to the port line that follows it. */
	flags = tls;
	port = 5552;
};

auth {
	user = "*@*";
	class = "users";
	/* No flood limits, and ignore class/per-IP limits entirely. */
	flags = can_flood, exceed_limit;
};

/*
 * Two test opers, password "password" for both, from anywhere.
 * encrypted = no: the password is compared as plain text, not a crypt hash.
 */
operator {
	name = "alice";
	user = "*@*";
	password = "password";
	encrypted = no;
	class = "users";
	umodes = "+s";
	flags = admin, close, connect, connect:remote, die, dline, globops,
		join:resv, kill, kill:remote, kline, locops, message:mass, module,
		nick:resv, opme, rehash, rehash:remote, remoteban, restart, resv,
		set, squit, squit:remote, undline, unkline, unresv, unxline, xline;
};

operator {
	name = "daniel";
	user = "*@*";
	password = "password";
	encrypted = no;
	class = "users";
	umodes = "+s";
	flags = admin, close, connect, connect:remote, die, dline, globops,
		join:resv, kill, kill:remote, kline, locops, message:mass, module,
		nick:resv, opme, rehash, rehash:remote, remoteban, restart, resv,
		set, squit, squit:remote, undline, unkline, unresv, unxline, xline;
};

general {
	/* No ident (connect-back) lookup -- see header. */
	disable_auth = yes;
	/* No reverse-DNS lookup of the client address -- see header. */
	disable_dns = yes;
	/*
	 * Default is 1 connection per IP per 1s; tests open several at once
	 * from one IP. throttle_time = 0 disables the throttle.
	 */
	throttle_count = 1000;
	throttle_time = 0 seconds;
	/* Don't make clients echo a PONG cookie before registering. */
	ping_cookie = no;
	/* Don't hide clients by default (keep WHO/NAMES output unsurprising). */
	invisible_on_connect = no;
	/* Don't rate-limit LIST/LUSERS/ADMIN/INFO etc. between uses. */
	pace_wait = 0 seconds;
	pace_wait_simple = 0 seconds;
};
