/*
 * Bahamut (DALnet) test server config. Plain TCP on 4444, TLS on 5554,
 * no passwords, no services. Everything not set here is the
 * compiled-in default; see doc/reference.conf in the bahamut source.
 */

global {
    name    bahamut.example.irc.com;
    info    "ExampleNet bahamut test server";
    admin {
        "ExampleNet test servers";
        "bahamut test server";
        "nobody@example.irc.com";
    };
};

options {
    network_name    ExampleNet;
    allow_split_ops;            # Op the first joiner of an empty channel:
                                # otherwise a lone unlinked server never
                                # does (it treats itself as split)
};

/*
 * No connect-back checks at all: clients connect from the Docker host,
 * so the ircd sees the Docker bridge gateway as the client, and a host
 * firewall may silently DROP connect-backs (and its resolver may never
 * answer PTR queries for the bridge range) -- each check would stall
 * registration for its full timeout.
 *   n: no reverse-DNS lookup, i: no ident check, S: TLS port.
 * The TLS certificate chain and key are ircd.crt / ircd.key next to
 * this file (compiled-in names).
 */
port {
    port    4444;
    flags   ni;
};
port {
    port    5554;
    flags   Sni;
};

class {
    name        users;
    pingfreq    90;         # PING idle connections every 90s
    maxsendq    100000;     # 100KB send buffer
    maxusers    1000;       # Maximum clients in this class
};

class {
    name        opers;
    pingfreq    90;
    maxsendq    1000000;
    maxusers    100;
};

# Test clients connect several at a time, and reconnect often, all from
# one address (the Docker bridge gateway). Per-IP clone limits and the
# reconnect throttle are compiled out in the Dockerfile (the allow
# block's C/T flags can't stop the throttle, which fires at accept time).
allow {
    host    *@*;
    class   users;
};

# OPER alice password / OPER daniel password, from anywhere. Plaintext
# passwords (crypt_oper_pass is not set). access * = every oper flag.
oper {
    name    alice;
    passwd  password;
    host    *@*;
    access  *;
    class   opers;
};
oper {
    name    daniel;
    passwd  password;
    host    *@*;
    access  *;
    class   opers;
};
