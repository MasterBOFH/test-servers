/*
 * ircd-ratbox 3.0.x test server config.
 * Minimal on purpose: anything not set here is the compiled-in default
 * (see doc/example.conf in the ircd-ratbox source).
 *
 * Connect-back checks are off (ident) and connection throttling is
 * neutralised. Test clients usually connect from the Docker host, so the
 * ircd sees the Docker bridge gateway as the client address; a host
 * firewall that silently drops connect-backs, or a resolver that never
 * answers PTR queries for the bridge range, would make every such check
 * wait out its full timeout before the client can register. (ratbox has no
 * switch for its reverse-DNS lookup of clients; the image patches that out
 * instead -- see no-reverse-dns.patch and the Dockerfile.)
 */

serverinfo {
	name = "ratbox.example.irc.com";
	sid = "0RB";
	description = "ircd-ratbox test server";
	network_name = "ExampleNet";
	network_desc = "ExampleNet test network";
	hub = no;

	/*
	 * The repo's shared test certificate (certs/), served by ssld.
	 * ssl_cert is loaded with SSL_CTX_use_certificate_chain_file, so the
	 * leaf+CA chain is sent. No ssl_dh_params: ssld then offers no DHE-
	 * ciphers; ECDHE and TLS 1.3 are unaffected.
	 */
	ssl_cert = "/opt/ratbox/etc/server-chain.crt";
	ssl_private_key = "/opt/ratbox/etc/server.key";
};

admin {
	name = "ExampleNet";
	description = "Test server administrator";
	email = "<nobody@example.irc.com>";
};

class "users" {
	ping_time = 2 minutes;
	/* Tests open several connections at once from the same (gateway) IP. */
	number_per_ident = 1000;
	number_per_ip = 1000;
	number_per_ip_global = 1000;
	number_per_cidr = 1000;
	cidr_ipv4_bitlen = 32;
	cidr_ipv6_bitlen = 128;
	max_number = 1000;
	sendq = 1 megabyte;
};

listen {
	port = 4446;
	sslport = 5556;
};

auth {
	user = "*@*";
	class = "users";
	/* Ignore class/per-IP limits and flood limits entirely. */
	flags = exceed_limit, flood_exempt, spambot_exempt;
};

/*
 * Two test opers, password "password" for both, from anywhere.
 * ~encrypted: the password is compared as plain text, not a crypt hash
 * (encrypted is on by default). The rest is every privilege there is.
 */
operator "alice" {
	user = "*@*";
	password = "password";
	flags = ~encrypted, global_kill, remote, kline, unkline, gline,
		nick_changes, rehash, die, admin, xline, resv, operwall,
		oper_spy, remoteban;
};

operator "daniel" {
	user = "*@*";
	password = "password";
	flags = ~encrypted, global_kill, remote, kline, unkline, gline,
		nick_changes, rehash, die, admin, xline, resv, operwall,
		oper_spy, remoteban;
};

channel {
	/*
	 * A lone server counts as "split" (default thresholds: 10 servers /
	 * 15000 users) and then refuses to create channels (437 on JOIN).
	 */
	default_split_server_count = 0;
	default_split_user_count = 0;
	no_create_on_split = no;
	no_join_on_split = no;
};

general {
	/* No ident (connect-back) lookup -- see header. */
	disable_auth = yes;
	/*
	 * Default throttle is 4 connections per IP per 60s, which a test run
	 * from one (gateway) IP blows through; make it unreachable.
	 */
	throttle_count = 100000;
	throttle_duration = 1 second;
	/* Don't cache and auto-reject IPs of previously rejected clients. */
	reject_after_count = 0;
	/* Don't make clients echo a PONG cookie before registering. */
	ping_cookie = no;
	/* Max lines buffered from a client before Excess Flood (default 20). */
	client_flood = 2000;
	/*
	 * Don't rate-limit LIST/LUSERS/ADMIN/INFO etc. per server (defaults
	 * 10s / 1s between uses, answered with 263 even for flood_exempt).
	 */
	pace_wait = 0 seconds;
	pace_wait_simple = 0 seconds;
};
