# ircd-irc2 (IRCnet ircd 2.11) test server config.
# Fields are |-separated; see doc/ircd.conf.example upstream.
# NOTE: ircd reads this file bottom-up; order within a type matters.
#
# No connect-back checks: clients connect from the Docker host, so the
# ircd sees the Docker bridge gateway as the client, and a host
# firewall may silently DROP connect-backs to it (and its resolver may
# never answer PTR queries for the bridge range). Every such check
# would stall registration for its full timeout. Ident and iauth's
# proxy/DNSBL scans are compiled out, and reverse DNS is patched out
# (no config switch exists) - see the Dockerfile.

# Server name, info, UDP ping port, SID, split thresholds. The
# thresholds are mandatory but ignored: ircd runs with -p standalone.
M|irc2.example.irc.com||ExampleNet irc2 test server|4440|000A|10|5000|

# Admin info; the 5th field is the network name (005 NETWORK=).
A|ExampleNet test servers|nobody@example.irc.com|test server||ExampleNet|

# Plain-TCP client port. ircd 2.11 has no native TLS.
P||||4440||

# Client class 1: ping 90s, 1000 clients, 512k sendq. The last two
# fields are per-IP.per-user@IP limits, locally and net-wide; they
# default to 1.1, too few for several test clients through the one
# gateway IP.
Y|1|90||1000|512000|1000.1000|1000.1000|

# Anyone, no password. The host-name field must stay empty: with
# reverse DNS patched out, no client ever has a host name, and a
# non-empty field (even "*") would require one.
I|*@*||||1||

# Operators: OPER alice password / OPER daniel password. Plaintext
# passwords (CRYPT_OPER_PASSWORD is off by default). Flag A grants
# every O-line privilege. The host field matches the client's IP,
# since clients never have a host name here.
O|*@*|password|alice||1|A|
O|*@*|password|daniel||1|A|
