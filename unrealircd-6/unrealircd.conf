/*
 * Minimal UnrealIRCd 6 config for the test-servers suite.
 * NOT a production config: everything that could reject, delay, or
 * flood-kill a burst of fresh test clients is relaxed or off.
 *
 * Why no connect-back checks (ident, DNSBL, reverse DNS): tests usually
 * connect from the Docker host, so the ircd sees the Docker bridge gateway
 * as the client; a host firewall that drops connect-backs, or a resolver
 * that never answers PTR queries for the bridge range, makes each check
 * wait out its full timeout and delays registration by seconds.
 */

/* No GeoIP. Without this, modules.default.conf fetches ~50MB of GeoIP
 * databases from geoip.unrealircd.org at every config load (at build time,
 * and again at boot once the cached copies are 14 days old); a hermetic
 * test image shouldn't depend on that. Must precede the include. */
@define $NO_DEFAULT_GEOIP "yes"

include "modules.default.conf";
include "operclass.default.conf";
include "snomasks.default.conf";
include "help/help.conf";

loadmodule "cloak_sha256";

/* DNSBL checks: a lookup against external resolvers per client (and the
 * module bumps set::handshake-delay to 2s whenever blacklist blocks exist).
 * No blacklist blocks are configured; unload the module anyway. */
blacklist-module "blacklist";
/* Connection-rate throttling for "new" (low-reputation) users — every
 * test client is new. */
blacklist-module "connthrottle";

me {
	name "unreal.example.irc.com";
	info "ExampleNet test server";
	sid "001";
}

admin {
	"ExampleNet test server";
	"admin@example.irc.com";
}

class clients {
	pingfreq 90;
	maxclients 1000;
	sendq 1M;
	recvq 8000;
}

allow {
	mask *;
	class clients;
	/* Default example is 3; tests open several clients from one IP
	 * (the Docker gateway), both at once and back to back. */
	maxperip 1000;
	global-maxperip 1000;
}

/* Plaintext clients (UnrealIRCd 6 steers toward TLS by default). */
listen {
	ip *;
	port 4441;
}

/* TLS clients, with the certificate from set::tls below. */
listen {
	ip *;
	port 5551;
	options { tls; }
}

/* Test opers: any user@host, plaintext password "password", every
 * privilege (netadmin-with-override is the broadest stock operclass).
 * Plaintext passwords only draw a boot-time warning. */
oper alice {
	class clients;
	mask *;
	password "password";
	operclass netadmin-with-override;
}

oper daniel {
	class clients;
	mask *;
	password "password";
	operclass netadmin-with-override;
}

set {
	network-name "ExampleNet";
	default-server "unreal.example.irc.com";
	services-server "services.example.irc.com";
	help-channel "#help";
	cloak-prefix "Clk";
	/* Random test-only keys (80 chars, mixed case + digits, as required). */
	cloak-keys {
		"IH0wa96SbSEq2eGU4VDSJdQQsmSLA18KKS3b68OAYfqiCl2TRLS1ZWWErqVZ9J9PetoLvWTuL09yT2Ei";
		"KGOojvhrklpOPuhClTUtlXHnTOLRFAoLh1FV70sYGHHeSJIMYtZYzKFuPWhAjdS5g9Bv8MXNbEnuxNl0";
		"VbC8TNReBO591WfxYlISeCf1dVLEBmEtiPZwFsy9qSRD1joFfjRiGylGwhujGp07QVhrEGUO9IwR9rfS";
	}
	kline-address "admin@example.irc.com";

	/* The repo's shared test certificate: leaf + CA chain, so clients can
	 * verify it against certs/ca.crt. */
	tls {
		certificate "tls/server-chain.crt";
		key "tls/server.key";
	}

	/* Default for opers is "deny": OPER over a plaintext connection is
	 * refused (with only a NOTICE, no numeric). Tests oper up on 4441. */
	plaintext-policy {
		oper allow;
	}

	options {
		/* No reverse DNS lookup of connecting clients (see header). */
		dont-resolve;
		/* identd-check is off by default in UnrealIRCd 6; left unset. */
	}

	/* Process client lines immediately (default only becomes 2s when
	 * blacklist blocks exist; pinned to 0 explicitly). */
	handshake-delay 0;
	/* Default 3: tests have several unregistered connections open at once. */
	max-unknown-connections-per-ip 1000;

	anti-flood {
		everyone {
			/* Default 3:60 — would refuse the 4th connection in a minute. */
			connect-flood 255:1; /* max allowed count/min period */
		}
		/* Fresh test clients fall in "unknown-users" (no reputation yet).
		 * Defaults there are 2 NICKs / 2 JOINs per 60–90s. */
		unknown-users {
			nick-flood 255:5;
			join-flood 255:5;
			away-flood 255:10;
			invite-flood 255:5;
			knock-flood 255:5;
			max-concurrent-conversations { users 20; new-user-every 1s; }
			/* No fake lag (default ~1s per command): tests fire commands
			 * back to back and expect prompt replies. */
			lag-penalty 0;
			lag-penalty-bytes 512;
		}
		known-users {
			nick-flood 255:5;
			join-flood 255:5;
			away-flood 255:10;
			invite-flood 255:5;
			knock-flood 255:5;
			max-concurrent-conversations { users 20; new-user-every 1s; }
			lag-penalty 0;
			lag-penalty-bytes 512;
		}
		/* Default (6.2+) puts every new channel on +F "normal"; off so
		 * channels behave like a vanilla ircd. */
		channel {
			default-profile off;
		}
	}
}
