# ircu2 (Undernet) test server config.
# Minimal on purpose: everything not set here is ircu's default; see
# doc/example.conf upstream.
#
# No connect-back checks: clients connect from the Docker host, so the
# ircd sees the Docker bridge gateway as the client, and a host
# firewall may silently DROP connect-backs to it (and its resolver may
# never answer PTR queries for the bridge range). Every ident/DNS check
# would stall registration for its full timeout. Ident is off by never
# naming a username in a Client block (see below); reverse DNS is off
# via NODNS. ircu has no built-in proxy/DNSBL scanner and no iauth is
# configured.

General {
  name = "ircu.example.irc.com";
  description = "ExampleNet ircu2 test server";
  numeric = 1;
};

Admin {
  Location = "ExampleNet test servers";
  Contact = "nobody@example.irc.com";
};

Class {
  name = "Local";
  pingfreq = 1 minutes 30 seconds;
  sendq = 160000;
  # 0 = no cap on clients in this class.
  maxlinks = 0;
};

# Class for opered clients. local = no makes them global opers, which
# by default get every privilege except the ones switched on below.
Class {
  name = "Opers";
  pingfreq = 1 minutes 30 seconds;
  sendq = 160000;
  maxlinks = 0;
  local = no;
  walk_lchan = yes;
  unlimit_query = yes;
  set = yes;
  badchan = yes;
  local_badchan = yes;
  apass_opmode = yes;
};

# Any client, no password. IP mask only: a host mask would need DNS,
# and any username mask (even "*@...") turns on ident for everyone.
# maxlinks here is per IP; default 65535, so many test connections
# through the one gateway IP are fine.
Client {
  ip = "*";
  class = "Local";
};

# OPER alice password / OPER daniel password, from anywhere.
# $PLAIN$ marks an unhashed password.
Operator {
  name = "alice";
  host = "*@*";
  password = "$PLAIN$password";
  class = "Opers";
};
Operator {
  name = "daniel";
  host = "*@*";
  password = "$PLAIN$password";
  class = "Opers";
};

# Plain-TCP client port. u2.10.12 has no native TLS.
Port {
  port = 4443;
};

features {
  "NETWORK" = "ExampleNet";
  "NODNS" = "TRUE";          # no reverse DNS lookup (see top)
  "AUTH_TIMEOUT" = "1";      # belt and braces: auth wait <= 1s
  # Send the real MOTD at signon; by default ircu sends only a
  # "Type /MOTD to read the AUP" stub.
  "NODEFAULTMOTD" = "FALSE";
  # Reconnect throttle (default 4 connects per 40s per IP) would trip
  # on test clients reconnecting from the one gateway IP.
  "IPCHECK_CLONE_LIMIT" = "1000";
  # CLIENT_FLOOD (recvq) is deliberately left at its 1024 default: a
  # GoBNC flood test depends on it.
  "LOG" = "SYSTEM" "FILE" "ircd.log";
  "LOG" = "SYSTEM" "LEVEL" "CRIT";
};
