# Minimal InspIRCd 4 config for the test-servers suite.
# NOT a production config: everything that could reject, delay, or
# flood-kill a burst of fresh test clients is relaxed or off.
#
# Replaces the official image's generated config entirely (that one
# listens on 6667/6697, has no usable opers, and loads connectban,
# connflood and dnsbl).
#
# Why no connect-back checks (ident, DNSBL, reverse DNS): tests usually
# connect from the Docker host, so the ircd sees the Docker bridge gateway
# as the client; a host firewall that drops connect-backs, or a resolver
# that never answers PTR queries for the bridge range, makes each check
# wait out its full timeout and delays registration by seconds.

<server
        name="inspircd.example.irc.com"
        description="ExampleNet test server"
        network="ExampleNet">

<admin
       name="ExampleNet test server"
       description="Test admin"
       email="admin@example.irc.com">

# Plaintext and TLS client ports. No server-link ports: this is a
# standalone test server.
<bind address="" port="4448" type="clients">
<bind address="" port="5558" type="clients" sslprofile="main">

<connect
         name="main"
         allow="*"
         maxchans="100"
         timeout="20"
         pingfreq="2m"
         hardsendq="1M"
         softsendq="1M"
         recvq="10K"
         # Default threshold 10 / commandrate 1000 (one line a second)
         # penalises tests that fire commands back to back. This allows
         # 100 lines a second with a large burst, without fake lag.
         threshold="1000"
         commandrate="100000"
         fakelag="no"
         # Default 3: tests open many clients from one IP (the Docker
         # gateway), both at once and back to back.
         localmax="1000"
         globalmax="1000"
         # No reverse DNS lookup of connecting clients (see header).
         resolvehostnames="no"
         # No ident lookup (the ident module isn't loaded either).
         useident="no"
         # No DNSBL lookups (the dnsbl module isn't loaded either).
         usednsbl="no"
         limit="5000">

<files motd="motd.txt">

# Log to stdout so it shows up in `docker logs`.
<log method="stdout"
     level="normal"
     type="* -USERINPUT -USEROUTPUT">

# Channel modes for a new channel; the "o" makes its creator (first
# joiner) an op.
<options defaultmodes="not">

# Default list-mode size; declared only to silence a startup warning.
<maxlist chan="*" limit="100">

#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-  OPERATORS  -#-#-#-#-#-#-#-#-#-#-#-#-#-#-#
# One class with every command and privilege, two opers using it from
# any user@host with plaintext password "password" (plaintext is the
# default when no hash= is given). sslonly is off by default.
<class name="Everything" commands="*" privs="*" usermodes="*" chanmodes="*" snomasks="*">
<type name="NetAdmin" classes="Everything">
<oper name="alice"  password="password" host="*@*" type="NetAdmin">
<oper name="daniel" password="password" host="*@*" type="NetAdmin">

#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-  MODULES  -#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#
# The official image's module set, minus everything that throttles or
# checks connecting clients: connectban (Z-lines an IP after 10
# connections), connflood (server-wide connection rate limit), dnsbl,
# conn_waitpong (PING cookie before registration), plus log_syslog and
# the NickServ-specific passforward, which a standalone server can't use,
# and the deprecated banredirect.
<module name="account">
<module name="alias">
<module name="allowinvite">
<module name="alltime">
<module name="banexception">
<module name="bcrypt">
<module name="blockcolor">
<module name="botmode">
<module name="callerid">
<module name="cap">
<module name="chancreate">
<module name="chanfilter">
<module name="chanhistory">
<module name="channelban">
<module name="chghost">
<module name="chgident">
<module name="chgname">
<module name="commonchans">
<module name="conn_umodes">
<module name="customprefix">
<customprefix name="founder" letter="q" prefix="~" rank="50000" ranktoset="50000">
<customprefix name="admin" letter="a" prefix="&amp;" rank="40000" ranktoset="50000">
<customprefix name="halfop" letter="h" prefix="%" rank="20000" ranktoset="30000">
<module name="cycle">
<module name="exemptchanops">
<module name="filter">
<module name="gateway">
<module name="globalload">
<module name="globops">
<module name="help">
<include file="&dir.example;/help.example.conf">
<module name="hidechans">
<module name="inviteexception">
<module name="ircv3">
<module name="ircv3_accounttag">
<module name="ircv3_batch">
<module name="ircv3_capnotify">
<module name="ircv3_chghost">
<module name="ircv3_ctctags">
<module name="ircv3_echomessage">
<module name="ircv3_invitenotify">
<module name="ircv3_labeledresponse">
<module name="ircv3_msgid">
<module name="ircv3_servertime">
<module name="joinflood">
<module name="knock">
<module name="messageflood">
<module name="monitor">
<module name="multiprefix">
<module name="noctcp">
<module name="nonotice">
<module name="operlog">
<module name="opermodes">
<module name="password_hash">
<module name="realnameban">
<module name="regex_glob">
<module name="sajoin">
<module name="sakick">
<module name="samode">
<module name="sanick">
<module name="sapart">
<module name="saquit">
<module name="satopic">
<module name="seenicks">
<module name="services">
<module name="sethost">
<module name="setident">
<module name="setname">
<module name="sha2">
<module name="shun">
<module name="silence">
<module name="spanningtree">
<module name="sslinfo">
<module name="sslmodes">
<module name="swhois">
<module name="tline">
<module name="uhnames">
<module name="xline_db">

# TLS with the repo's shared certificate: leaf + CA chain, so clients can
# verify it against certs/ca.crt. dhparams.pem is generated once at image
# build time (the official entrypoint generates it at every start).
<module name="ssl_gnutls">
<sslprofile name="main"
            provider="gnutls"
            certfile="server-chain.crt"
            keyfile="server.key"
            dhfile="dhparams.pem"
            hash="sha3-256"
            priority="NORMAL"
            requestclientcert="yes">
